name: CI Quality

on:
  push:
    branches:
      - master
    paths-ignore:
      - PROGRESS.md
  pull_request:
    paths-ignore:
      - PROGRESS.md
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build And Type Check
        run: npm run ci

      - name: Lighthouse Quality Gate
        timeout-minutes: 8
        env:
          LH_MIN_PERFORMANCE: ${{ github.ref == 'refs/heads/master' && '80' || '90' }}
          LH_MIN_ACCESSIBILITY: "90"
          LH_MIN_BEST_PRACTICES: "90"
          LH_MIN_SEO: "100"
          LH_SKIP_BUILD: "1"
          LH_TIMEOUT_MS: "120000"
          LH_RETRIES: "3"
          LH_WARMUP: "1"
        run: npm run audit:lighthouse
